  text-decoration: none;

}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,

h5,

}

b,
strong,

  overflow-x: auto;

  text-align: start;

.table :is(th, td) {

  border-bottom: 1px solid var(--border);

  vertical-align: top;

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

.table :is(caption, thead th) {

  width: 100%;
  padding: 0;

.card {

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-small,

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {

  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;

.viz-controls {

  align-items: center;
  gap: 8px;

.btn {

  display: inline-flex;
  inline-size: fit-content;

  min-height: 28px;
  align-items: center;

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);

.form-control:focus-visible {

.form-control:disabled,

  padding: 0 32px 0 8px;

  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);

  height: 14px;

  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:

    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);

  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

          &lt;span class=&quot;hf-prompt-label&quot;&gt;已填充模板 Prompt&lt;/span&gt;&lt;div class=&quot;hf-prompt-block&quot;&gt;Image 1 是必须准确保留版型、颜色、材质、纹理与标识的黑色西装；Image 2 是模特参考，保持其身份、面部、发型与体态。让时尚女性模特自然穿着 Image 1，自然站姿、轻微侧身，置于极简室内，服装与人体结构贴合真实，采用半身时尚摄影构图，面向电商详情页制作成图。&lt;/div&gt;
          &lt;span class=&quot;hf-prompt-label&quot;&gt;系统负向约束&lt;/span&gt;&lt;div class=&quot;hf-prompt-block&quot;&gt;改变服装版型、颜色、纹理或 Logo；穿透、肢体错位、额外手指、脸部漂移、衣物褶皱不自然、低清、乱码、水印。&lt;/div&gt;

        &lt;div class=&quot;hf-case-meta&quot;&gt;&lt;div&gt;&lt;span&gt;输入槽位&lt;/span&gt;&lt;strong&gt;文字设定 + 可选参考&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;默认输出&lt;/span&gt;&lt;strong&gt;3:4 / 9:16 · 4 张&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;业务变量&lt;/span&gt;&lt;strong&gt;角色 / 世界观 / 姿势&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;hf-asset-section&quot;&gt;
      &lt;h3&gt;素材清单：先准备首发案例&lt;/h3&gt;
      &lt;p class=&quot;hf-asset-lead&quot;&gt;文生图不要求图片素材；图生图和场景模板按下面清单准备即可。建议先给 1 个 SKU、1 套服装和 1 个角色样例，先验证 Prompt 与成片质量，再扩充数量。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;
        &lt;table class=&quot;table table-sm hf-asset-table&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;案例&lt;/th&gt;&lt;th&gt;优先级&lt;/th&gt;&lt;th&gt;必需素材&lt;/th&gt;&lt;th&gt;可选素材 / 说明&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;商品质感升级&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;td&gt;商品正面图 1 张，长边 ≥ 2000px&lt;/td&gt;&lt;td&gt;透明底图、包装文字特写、品牌色与禁用改动清单&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;人像风格焕新&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;td&gt;正脸或半身人像 1 张，已获肖像授权&lt;/td&gt;&lt;td&gt;风格参考 2–3 张、希望保留的脸部/发型说明&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;电商主图换背景&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;td&gt;商品图 1 张（无复杂遮挡）&lt;/td&gt;&lt;td&gt;背景参考 2 张、品牌色、常用比例（1:1 / 4:5）&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;模特穿搭试穿&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;td&gt;服装平铺或白底图 1 张&lt;/td&gt;&lt;td&gt;模特参考 1 张、正背面图、尺码/版型说明、禁改细节&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;品牌海报 / 角色类&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;P1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;产品或角色主体素材 1 张，及准确文字稿&lt;/td&gt;&lt;td&gt;Logo PNG/SVG、字体/色值、旧海报或角色设定图、目标渠道比例&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
      &lt;p class=&quot;hf-caption&quot;&gt;统一补充：目标渠道、输出比例、数量、清晰度、必须保留项、禁止出现项；涉及人物/IP 时同时提供授权或可用范围。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;hf-maintenance-section&quot;&gt;
      &lt;h3&gt;Prompt 资产与维护方式&lt;/h3&gt;
      &lt;p class=&quot;hf-maintenance-lead&quot;&gt;不要把每条案例写成 Skill。Skill 只承载编译规则；案例内容、字段和版本作为配置资产维护，生成时再保存一次不可变编译快照。&lt;/p&gt;
      &lt;div class=&quot;table-responsive&quot;&gt;
        &lt;table class=&quot;table table-sm hf-maintenance-table&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;层级&lt;/th&gt;&lt;th&gt;建议形式&lt;/th&gt;&lt;th&gt;保存内容&lt;/th&gt;&lt;th&gt;维护策略&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;编译规则&lt;/td&gt;&lt;td&gt;PromptCompilerService / Skill 规则&lt;/td&gt;&lt;td&gt;字段顺序、参考图角色、保留/禁止项、校验规则&lt;/td&gt;&lt;td&gt;代码评审 + 单元测试，规则升级有版本号&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;案例配置&lt;/td&gt;&lt;td&gt;PromptPreset / NodeTemplate（JSON + 数据库）&lt;/td&gt;&lt;td&gt;名称、模式、输入字段、默认文案、正向/负向模板、状态&lt;/td&gt;&lt;td&gt;草稿 → 评审 → 发布 → 归档；新任务只读最新发布版&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;编译快照&lt;/td&gt;&lt;td&gt;GenerationRun / GenerationJob 快照&lt;/td&gt;&lt;td&gt;原始输入、素材 ID 与角色、已填充 Prompt、编译器版本、案例版本、哈希&lt;/td&gt;&lt;td&gt;生成后不可覆盖，保证历史结果可复现和可追责&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;质量样例&lt;/td&gt;&lt;td&gt;PromptEvalCase（JSON / 数据库）&lt;/td&gt;&lt;td&gt;测试素材、期望保留项、禁出项、人工评分与失败原因&lt;/td&gt;&lt;td&gt;每次发布前跑回归，低于阈值不允许上线&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
      &lt;p class=&quot;hf-caption&quot;&gt;最小可落地方案：先用版本化 JSON 管理 PromptPreset，稳定后迁移到数据库；场景模板继续复用 NodeTemplate，图生图/文生图快捷案例共用 PromptPreset。&lt;/p&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot; style=&quot;margin-top:18px&quot;&gt;资产生命周期&lt;/p&gt;
    &lt;div class=&quot;hf-lifecycle&quot;&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;01 · 草稿&lt;/strong&gt;&lt;span&gt;补齐输入字段、正向 Prompt 和负向约束&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;02 · 评审&lt;/strong&gt;&lt;span&gt;用素材清单跑样例，检查保留项和失败边界&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;03 · 发布&lt;/strong&gt;&lt;span&gt;锁定版本，默认设置独立下发并记录编译器版本&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;04 · 归档&lt;/strong&gt;&lt;span&gt;旧版本只读，历史 GenerationRun 仍可复现&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;hf-caption&quot;&gt;最小落地：先用版本化 JSON 管理 PromptPreset，稳定后迁移到数据库；Skill / PromptCompilerService 只维护编译规则，不承载具体案例文案。&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;hf-view&quot; data-view-panel=&quot;creative-director&quot; hidden&gt;
    &lt;div class=&quot;hf-case-header&quot;&gt;
      &lt;div&gt;
        &lt;p class=&quot;hf-eyebrow&quot;&gt;Agent 唯一入口 · 多模态创意导演&lt;/p&gt;
        &lt;h2&gt;让用户说目标，让 Agent 把目标变成可执行的图片方案&lt;/h2&gt;
        &lt;p class=&quot;hf-case-lead&quot;&gt;本方案参考 OpenTu 的对话式创作和 Skill 组织方式，但沿用 HitFrame 现有竖型对话框、统一任务链路与商业图片工作区。AI 图片保持直接、可控；创意导演只存在于 Agent。&lt;/p&gt;
      &lt;/div&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;待产品 + 技术确认&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;hf-positioning&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;strong&gt;AI 图片&lt;/strong&gt;&lt;span&gt;传统生图工作区：文生图、图生图、参考图、参数、直接生成。&lt;/span&gt;&lt;span class=&quot;viz-badge&quot;&gt;不加入对话导演&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;strong&gt;Agent&lt;/strong&gt;&lt;span&gt;唯一的对话式创作入口：理解需求、推荐 Skill、补全信息、编译 Prompt。&lt;/span&gt;&lt;span class=&quot;viz-badge&quot;&gt;创意导演&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;strong&gt;模板配置页&lt;/strong&gt;&lt;span&gt;继续使用槽位、变量和参数表单，可把当前上下文带入 Agent。&lt;/span&gt;&lt;span class=&quot;viz-badge&quot;&gt;结构化配置&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;产品边界与职责矩阵&lt;/p&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;能力&lt;/th&gt;&lt;th&gt;AI 图片&lt;/th&gt;&lt;th&gt;Agent 创意导演&lt;/th&gt;&lt;th&gt;实现约束&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;提示词&lt;/td&gt;&lt;td&gt;用户直接编辑原始 Prompt&lt;/td&gt;&lt;td&gt;原样 / 智能增强 / 创意导演三种处理&lt;/td&gt;&lt;td&gt;增强前后只在 Agent 展示&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;参考图&lt;/td&gt;&lt;td&gt;上传并直接用于图生图&lt;/td&gt;&lt;td&gt;分析图片、指定角色和保真等级&lt;/td&gt;&lt;td&gt;真实品牌商品默认严格保留&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Skill&lt;/td&gt;&lt;td&gt;不展示 Skill 对话&lt;/td&gt;&lt;td&gt;自动推荐，可手动切换&lt;/td&gt;&lt;td&gt;Skill 只产生图片，不生成文章正文&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;执行&lt;/td&gt;&lt;td&gt;点击生成即进入统一链路&lt;/td&gt;&lt;td&gt;方案确认后才创建 Run / Job&lt;/td&gt;&lt;td&gt;分析、编译、预览零扣点&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;结果&lt;/td&gt;&lt;td&gt;结果面板和资产库&lt;/td&gt;&lt;td&gt;回到同一条 Agent 对话时间线&lt;/td&gt;&lt;td&gt;单图、图片组、宫格图共用任务模型&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;模型职责：一个理解，一个出图&lt;/p&gt;
    &lt;div class=&quot;hf-stack&quot; role=&quot;img&quot; aria-label=&quot;gpt-5.6-sol 和 gpt-image-2 的职责分工&quot;&gt;
      &lt;div class=&quot;hf-node&quot;&gt;&lt;strong&gt;gpt-5.6-sol&lt;/strong&gt;&lt;span&gt;多模态创意导演：理解中文目标、观察参考图、判断角色、推荐 Skill、追问缺失信息。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-node&quot;&gt;&lt;strong&gt;Prompt Compiler&lt;/strong&gt;&lt;span&gt;把原始需求、Skill、角色、控制项编译成结构化方案、正向 Prompt、负向约束和文字叠加计划。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-node&quot;&gt;&lt;strong&gt;用户确认&lt;/strong&gt;&lt;span&gt;查看补充、修改方案或 Prompt，明确确认生成数量、比例、质量和预计点数。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-node&quot;&gt;&lt;strong&gt;gpt-image-2&lt;/strong&gt;&lt;span&gt;最终图片生成 / 编辑：t2i、i2i、模板、单图或图片组，不承担需求理解和品牌事实判断。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;hf-foundation&quot;&gt;&lt;span&gt;&lt;strong&gt;服务端密钥&lt;/strong&gt; 只在中转站服务端&lt;/span&gt;&lt;span&gt;&lt;strong&gt;前端可见&lt;/strong&gt; 仅方案与脱敏摘要&lt;/span&gt;&lt;span&gt;&lt;strong&gt;图片文字&lt;/strong&gt; 前端 / 合成层叠加&lt;/span&gt;&lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;三种处理方式&lt;/p&gt;
    &lt;div class=&quot;hf-case-rulebar&quot;&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;原样 · 按我的描述执行&lt;/strong&gt;&lt;span&gt;保留原始创意，不提出新主题、不补营销卖点；只做素材检查、参数确认和必要的安全约束。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;智能增强 · 补全执行方案&lt;/strong&gt;&lt;span&gt;补齐主体、构图、光影、材质、保真和负向约束；不改变意图，不新增未经确认的品牌事实、功效或卖点。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;创意导演 · 让 Agent 设计方案&lt;/strong&gt;&lt;span&gt;在目标上提出主题、视觉叙事、色彩、场景、构图、标题、卖点和图片组建议；每项新增内容标记“AI 建议，待确认”。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;hf-caption&quot;&gt;模式必须只出现在 Agent 对话框中。AI 图片页只保留“ 不知道怎么描述？去 Agent 获取创作方案 ”的轻量入口。&lt;/p&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;首期图片 Skill 目录&lt;/p&gt;
    &lt;div class=&quot;hf-prompt-tags&quot;&gt;
      &lt;span class=&quot;hf-prompt-tag&quot;&gt;自动&lt;/span&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;商品换背景&lt;/span&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;模特上身 / 真人试穿&lt;/span&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;电商海报&lt;/span&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;小红书封面&lt;/span&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;小红书多图组&lt;/span&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;宫格图 / 九宫格&lt;/span&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;文章配图&lt;/span&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;信息图&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;hf-case-rulebar&quot;&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;图片组&lt;/strong&gt;&lt;span&gt;共享一份创意方案，拆成编号明确的图片任务；每张图记录自己的 Prompt 快照。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;文章配图&lt;/strong&gt;&lt;span&gt;只生成图片，不生成文章、标题正文或文档。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;信息图&lt;/strong&gt;&lt;span&gt;首期只输出图片，不承诺可编辑 SVG 或结构化图表。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;明确排除&lt;/strong&gt;&lt;span&gt;PPT 大纲、文章正文、文档生成不在本项目范围。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;Agent 对话和工作步骤&lt;/p&gt;
    &lt;div class=&quot;hf-lifecycle&quot; aria-label=&quot;Agent 创意导演工作步骤&quot;&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;01 · 描述目标&lt;/strong&gt;&lt;span&gt;用户输入自然语言，可上传图片或引用资产。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;02 · 推荐 Skill&lt;/strong&gt;&lt;span&gt;返回推荐类型、t2i / i2i、比例、数量和缺图提示。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;03 · 定义角色&lt;/strong&gt;&lt;span&gt;给每张参考图指定商品、人物、背景、风格或 Logo 角色。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;04 · 补齐信息&lt;/strong&gt;&lt;span&gt;只追问影响成片的缺失项，如卖点、Logo、文案安全区、图数。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;05 · 生成方案&lt;/strong&gt;&lt;span&gt;展示主题、场景、构图、光影、文字计划和 AI 建议。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;06 · 编译 Prompt&lt;/strong&gt;&lt;span&gt;用户可查看、编辑、回退原始需求并重新编译。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;07 · 确认生成&lt;/strong&gt;&lt;span&gt;确认后才进入 hold → queue → worker → settle / refund。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;参考图角色与保真等级&lt;/p&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;角色&lt;/th&gt;&lt;th&gt;用途&lt;/th&gt;&lt;th&gt;默认保真&lt;/th&gt;&lt;th&gt;编译要求&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;商品主体&lt;/td&gt;&lt;td&gt;产品外观、包装、材质、Logo&lt;/td&gt;&lt;td&gt;严格保留&lt;/td&gt;&lt;td&gt;图生图锁定主体，禁止重绘包装文字&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;人物主体&lt;/td&gt;&lt;td&gt;身份、脸部、发型、体态&lt;/td&gt;&lt;td&gt;严格保留&lt;/td&gt;&lt;td&gt;禁止换脸、年龄漂移和额外肢体&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;背景参考&lt;/td&gt;&lt;td&gt;空间、氛围、色彩和光线&lt;/td&gt;&lt;td&gt;允许艺术化变化&lt;/td&gt;&lt;td&gt;只影响场景，不覆盖主体角色&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;风格参考&lt;/td&gt;&lt;td&gt;摄影、插画、色彩和质感&lt;/td&gt;&lt;td&gt;允许艺术化变化&lt;/td&gt;&lt;td&gt;不得指向在世艺术家模仿&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Logo / 品牌素材&lt;/td&gt;&lt;td&gt;品牌标志和官方字形&lt;/td&gt;&lt;td&gt;严格保留&lt;/td&gt;&lt;td&gt;精确文字交给前端 / 合成层，模型只负责留白和主体关系&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;p class=&quot;hf-caption&quot;&gt;真实 OPPO、香奈儿、黄天鹅、以纯等品牌素材必须由用户提供并以参考图进入 i2i；无品牌护肤品或耳机可以作为“通用演示素材”建立虚拟品牌，但不能伪造真实品牌产品。&lt;/p&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;多模态请求协议&lt;/p&gt;
    &lt;div class=&quot;hf-prompt-contract&quot;&gt;
      &lt;div class=&quot;hf-prompt-contract-head&quot;&gt;&lt;strong&gt;POST /api/v1/prompts/compile&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;只分析和编译 · 不扣点 · 不创建任务&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-prompt-block&quot;&gt;{ mode, generationMode, rawPrompt, skill, templateId, references: [{ assetId, role, fidelity }], controls: { ratio, candidateCount, quality } }&lt;/div&gt;
      &lt;div class=&quot;hf-prompt-tags&quot;&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;model: gpt-5.6-sol&lt;/span&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;response_format: json_object&lt;/span&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;服务端保存 API Key&lt;/span&gt;&lt;span class=&quot;hf-prompt-tag&quot;&gt;参考图需上游可读 URL / 受控 base64&lt;/span&gt;&lt;/div&gt;
      &lt;p class=&quot;hf-caption&quot;&gt;服务端必须根据 assetId 解析原图，并生成短时效、不可公开索引的上游可读地址；仅传 assetId、role、fidelity 元数据不足以支持多模态观察。前端不得接触中转站密钥。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;hf-prompt-contract&quot;&gt;
      &lt;div class=&quot;hf-prompt-contract-head&quot;&gt;&lt;strong&gt;编译响应（建议协议）&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;结构化结果可直接渲染方案卡&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-prompt-block&quot;&gt;{ normalizedBrief, referenceAnalysis, compiledPrompt, negativePrompt, textOverlayPlan, directorSuggestions, changeSummary, warnings, missingQuestions }&lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;Prompt 可追溯与回填&lt;/p&gt;
    &lt;div class=&quot;hf-layer-flow&quot; role=&quot;img&quot; aria-label=&quot;从用户需求到最终图片的提示词追溯链&quot;&gt;
      &lt;div class=&quot;hf-layer-step&quot;&gt;&lt;strong&gt;用户原始需求&lt;/strong&gt;&lt;span&gt;原文、输入时间、模式和 Skill&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-layer-step&quot;&gt;&lt;strong&gt;参考图观察&lt;/strong&gt;&lt;span&gt;图片角色、保真等级、观察摘要&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-layer-step&quot;&gt;&lt;strong&gt;结构化方案&lt;/strong&gt;&lt;span&gt;主题、场景、构图、光影、文案建议&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-layer-step&quot;&gt;&lt;strong&gt;最终执行 Prompt&lt;/strong&gt;&lt;span&gt;正向、负向、设置、编译器版本和哈希&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-layer-step&quot;&gt;&lt;strong&gt;生成快照&lt;/strong&gt;&lt;span&gt;provider、model、耗时、结果和点数&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;hf-case-rulebar&quot;&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;查看执行提示词&lt;/strong&gt;&lt;span&gt;默认折叠，用户主动展开查看完整正向与负向 Prompt。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;查看本次补充&lt;/strong&gt;&lt;span&gt;逐条展示“锁定商品主体、增加商业光影、添加负向约束”等变化。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;编辑 / 回退 / 重编译&lt;/strong&gt;&lt;span&gt;编辑最终 Prompt 或恢复原始需求，均产生新版本，不覆盖历史快照。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;同一素材三模式对比演示&lt;/p&gt;
    &lt;div class=&quot;hf-case-rulebar&quot;&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;固定输入&lt;/strong&gt;&lt;span&gt;同一张护肤品参考图、同一比例、同一质量、同一数量和同一点数。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;用户需求&lt;/strong&gt;&lt;span&gt;“给这瓶护肤品做一张小红书封面，突出红山茶花和轻盈质地。”&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;原样&lt;/strong&gt;&lt;span&gt;只做执行检查，原始 Prompt 几乎不变，不主动增加主题或卖点。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;智能增强&lt;/strong&gt;&lt;span&gt;补齐产品主体、构图、光线、保真项、负向约束和文字安全区。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;创意导演&lt;/strong&gt;&lt;span&gt;提出“红山茶花焕活年轻光采”等主题、版式和卖点建议，全部标记待确认。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;hf-caption&quot;&gt;验收页面必须同时显示：用户原始输入、Skill、追问过程、参考图角色、图片观察、结构化方案、增强前后 Prompt、修改摘要、用户确认内容、生成结果、耗时和点数。&lt;/p&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;计费、失效与安全边界&lt;/p&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;操作&lt;/th&gt;&lt;th&gt;扣点&lt;/th&gt;&lt;th&gt;创建 Run / Job&lt;/th&gt;&lt;th&gt;规则&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Skill 推荐、图片分析、Prompt 编译&lt;/td&gt;&lt;td&gt;否&lt;/td&gt;&lt;td&gt;否&lt;/td&gt;&lt;td&gt;允许反复编辑、重新编译&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;方案预览、模式切换、追问&lt;/td&gt;&lt;td&gt;否&lt;/td&gt;&lt;td&gt;否&lt;/td&gt;&lt;td&gt;不产生计费流水&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;确认方案并生成&lt;/td&gt;&lt;td&gt;是&lt;/td&gt;&lt;td&gt;是&lt;/td&gt;&lt;td&gt;复用现有 hold → queue → worker → settle / refund&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;修改素材、角色、比例、Skill 或模式&lt;/td&gt;&lt;td&gt;否&lt;/td&gt;&lt;td&gt;否&lt;/td&gt;&lt;td&gt;旧方案标记失效，必须重新编译&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;hf-case-rulebar&quot;&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;品牌与文字&lt;/strong&gt;&lt;span&gt;真实品牌只能基于用户提供的素材；精确中文、标题、卖点和 Logo 由前端 / 合成层叠加，图片模型负责画面和留白。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;密钥与隐私&lt;/strong&gt;&lt;span&gt;中转站密钥仅服务端保存；上游图片地址短时效、不可公开索引；响应对外只返回脱敏错误。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;编译失败&lt;/strong&gt;&lt;span&gt;明确返回可修复的缺失问题；不得静默伪造方案。无 gpt-5.6-sol 时仅允许受控规则降级，并标记为 fallback。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;分阶段开发计划&lt;/p&gt;
    &lt;div class=&quot;hf-lifecycle&quot; aria-label=&quot;创意导演分阶段开发计划&quot;&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;D0 · 契约冻结&lt;/strong&gt;&lt;span&gt;shared 类型、Skill 枚举、模式、参考图角色、编译响应和错误码。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;D1 · 服务端编译器&lt;/strong&gt;&lt;span&gt;gpt-5.6-sol 中转调用、图片解析、JSON 校验、版本化快照和日志。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;D2 · Agent 对话 UI&lt;/strong&gt;&lt;span&gt;Skill 菜单、三模式、角色标注、缺失追问、方案卡和 Prompt 折叠查看。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;D3 · 执行闭环&lt;/strong&gt;&lt;span&gt;确认门禁、生成 DTO、现有队列计费、结果回填同一时间线。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;D4 · 图片组与 Skill 扩展&lt;/strong&gt;&lt;span&gt;小红书多图组、宫格图、文章配图、信息图共享方案并拆分任务。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;D5 · 质量回归&lt;/strong&gt;&lt;span&gt;三模式对比、真实品牌 i2i、虚拟品牌 t2i、失败脱敏和账实回归。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;产品与技术验收门槛&lt;/p&gt;
    &lt;div class=&quot;hf-case-rulebar&quot;&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;结构&lt;/strong&gt;&lt;span&gt;AI 图片没有创意导演切换；Agent 是唯一对话入口；模板页可带入上下文。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;功能&lt;/strong&gt;&lt;span&gt;Skill 推荐、角色和保真、三模式差异、追问、方案修改、Prompt 查看和回退均可用。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;任务&lt;/strong&gt;&lt;span&gt;确认前零扣点零任务；确认后复用统一队列；结果回到 Agent 时间线。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;质量&lt;/strong&gt;&lt;span&gt;同一素材三模式对比可解释；真实品牌保真；虚拟品牌明确标注；中文信息不依赖模型绘制。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;可观测&lt;/strong&gt;&lt;span&gt;记录原始需求、编译版本、模型、耗时、错误、点数和结果，不泄漏密钥、路径或上游原文。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;hf-caption&quot;&gt;最终产品定义：AI 图片是直接出图工具；Agent 是对话式创意导演。两者共享视觉语言、素材库和统一生成链路，但入口、职责和交互深度明确分离。&lt;/p&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;本次产品确认结论&lt;/p&gt;
    &lt;div class=&quot;hf-case-rulebar&quot;&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;入口边界已锁定&lt;/strong&gt;&lt;span&gt;AI 图片继续是传统直接生图工作区；原样、智能增强、创意导演只存在于 Agent，不把 AI 图片改造成对话式工作台。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;首期范围已锁定&lt;/strong&gt;&lt;span&gt;只做图片 Skill：商品换背景、模特上身、电商海报、小红书封面、小红书多图组、宫格图、文章配图、信息图。PPT 大纲、文章正文、文档生成明确排除。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;商业真实规则&lt;/strong&gt;&lt;span&gt;真实品牌商品必须使用用户提供的参考图进入 i2i；无品牌护肤品和耳机可以作为通用演示素材并建立虚拟品牌，不凭空编造真实品牌产品。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;质量与控制项&lt;/strong&gt;&lt;span&gt;不强制所有商用模板默认 high；保留产品既有质量策略，同时逐步暴露比例、数量、质量、留白、文字安全区、保真和创意强度等可调整控制项，供预览和生产分别使用。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;计费门禁&lt;/strong&gt;&lt;span&gt;Skill 推荐、图片观察、提示词增强、方案预览和编译全部零扣点；用户确认方案并生成后才进入现有 hold → queue → worker → settle / refund。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;D0 · 产品与技术冻结表&lt;/p&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;冻结项&lt;/th&gt;&lt;th&gt;确认结论&lt;/th&gt;&lt;th&gt;开发约束 / 验收证据&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;编译模型&lt;/td&gt;&lt;td&gt;&lt;code&gt;gpt-5.6-sol&lt;/code&gt;，经服务端中转调用&lt;/td&gt;&lt;td&gt;多模态理解中文需求和参考图；前端不持有密钥&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;出图模型&lt;/td&gt;&lt;td&gt;&lt;code&gt;gpt-image-2&lt;/code&gt;&lt;/td&gt;&lt;td&gt;只负责 t2i / i2i / 模板出图，不负责需求理解和品牌事实判断&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;调用协议&lt;/td&gt;&lt;td&gt;中转站 OpenAI-compatible 协议，由 Provider Adapter 隔离&lt;/td&gt;&lt;td&gt;模型、端点、超时、重试和响应解析不可散落在业务层&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;多模态输入&lt;/td&gt;&lt;td&gt;服务端按 &lt;code&gt;assetId&lt;/code&gt; 读取图片，转短时效 signed URL 或受控 base64&lt;/td&gt;&lt;td&gt;仅传 assetId、角色元数据不足以完成图片观察；需记录传递方式和失败原因&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;结构化输出&lt;/td&gt;&lt;td&gt;JSON Schema / &lt;code&gt;json_object&lt;/code&gt;，服务端二次校验&lt;/td&gt;&lt;td&gt;解析失败不得静默伪造方案；返回可修复的缺失问题或脱敏错误码&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;版本与幂等&lt;/td&gt;&lt;td&gt;compiler、skill、promptCompilation、requestHash 全部版本化&lt;/td&gt;&lt;td&gt;修改素材、角色、Skill、模式、比例、质量或数量时旧方案失效并重新编译&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;降级策略&lt;/td&gt;&lt;td&gt;仅允许受控规则 fallback&lt;/td&gt;&lt;td&gt;响应显式返回 &lt;code&gt;fallback=true&lt;/code&gt; 与原因；不得伪装成模型增强结果&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;安全与日志&lt;/td&gt;&lt;td&gt;租户隔离、MIME / 大小校验、脱敏日志和统一错误响应&lt;/td&gt;&lt;td&gt;不得记录 API Key、Authorization、完整授权 URL、敏感图片内容或上游错误原文&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;p class=&quot;hf-caption&quot;&gt;D0 通过的定义：以上字段、枚举、错误语义、图片传递协议和版本失效规则由产品与技术共同确认，并与 shared 类型、API DTO 和数据库快照字段一一对应。&lt;/p&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;Prompt Compiler 四段式逻辑&lt;/p&gt;
    &lt;div class=&quot;hf-lifecycle&quot; aria-label=&quot;Prompt Compiler 四段式处理逻辑&quot;&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;01 · 确定性预处理&lt;/strong&gt;&lt;span&gt;清理输入、确定模式、Skill、比例、数量、质量、参考图角色和保真等级，校验租户与素材权限。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;02 · 多模态推理&lt;/strong&gt;&lt;span&gt;调用 gpt-5.6-sol 观察参考图并理解目标；只提出与成片有关的有限追问，不擅自增加品牌事实。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;03 · Schema 与策略校验&lt;/strong&gt;&lt;span&gt;检查字段完整性、角色冲突、真实品牌保真、文字边界、负向约束和可执行性；失败时返回缺失项。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-lifecycle-step&quot;&gt;&lt;strong&gt;04 · 编译执行 Prompt&lt;/strong&gt;&lt;span&gt;产出正向 Prompt、负向约束、文字叠加计划、修改摘要、警告、缺失问题和可追溯版本。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;hf-caption&quot;&gt;提示词增强不是简单翻译或润色：原样只检查，智能增强补齐执行细节，创意导演才提出新的主题与商业视觉建议；所有新增创意必须显式标记“AI 建议，待确认”。&lt;/p&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;冻结版编译响应契约&lt;/p&gt;
    &lt;div class=&quot;hf-prompt-contract&quot;&gt;
      &lt;div class=&quot;hf-prompt-contract-head&quot;&gt;&lt;strong&gt;POST /api/v1/prompts/compile&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;D0 统一字段后再进入实现验收&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-prompt-block&quot;&gt;{ compileId, mode, compilerProvider, compilerModel, compilerVersion, rawPrompt, normalizedBrief, referenceAnalysis, compiledPrompt, negativePrompt, textOverlayPlan, directorSuggestions, changeSummary, warnings, missingQuestions, requiresConfirmation, requestHash, fallback }&lt;/div&gt;
      &lt;div class=&quot;hf-case-rulebar&quot;&gt;
        &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;用户可见&lt;/strong&gt;&lt;span&gt;原始需求、结构化方案、参考图观察摘要、正向 / 负向 Prompt、文字叠加计划、本次补充、警告和缺失问题。&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;服务端审计&lt;/strong&gt;&lt;span&gt;provider、model、compilerVersion、skillVersion、requestHash、fallback 原因和不可变快照。&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;hf-caption&quot;&gt;当前代码中的 PromptCompileResponseDto 尚未完整承载上述字段；这是 D0 前的契约差异，不代表能力已完成。冻结后必须同步 shared DTO、API、前端方案卡和快照表，再进行端到端验收。&lt;/p&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;方案失效、追溯与重新编译&lt;/p&gt;
    &lt;div class=&quot;hf-case-rulebar&quot;&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;不可变链路&lt;/strong&gt;&lt;span&gt;保存用户原始需求、结构化方案、参考图角色与观察摘要、最终 Prompt、负向约束、文字计划、编译器 / 模型 / Skill 版本和请求哈希。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;版本行为&lt;/strong&gt;&lt;span&gt;查看、编辑、回退、修改素材或任何控制项都产生新版本，不覆盖历史快照；旧 promptCompilationId 不得继续执行。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;执行快照&lt;/strong&gt;&lt;span&gt;确认生成时把最终方案复制到 GenerationRun / GenerationJob，结果、耗时、点数和失败码与该快照绑定。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;产品确认清单 · 待签字项&lt;/p&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;确认项&lt;/th&gt;&lt;th&gt;当前状态&lt;/th&gt;&lt;th&gt;确认人 / 备注&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;AI 图片与 Agent 入口边界&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;待确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;产品&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Skill 范围与排除项&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;待确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;产品&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;三模式语义与 AI 建议标识&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;待确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;产品 + 设计&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;模型分工与中转协议&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;待确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;技术&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;参考图角色、保真和真实品牌规则&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;待确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;产品 + 技术&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;编译响应字段、版本失效和追溯&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;待确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;技术&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;计费门禁、fallback 和安全日志&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;待确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;技术 + 运维&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;真实品牌 i2i 与虚拟品牌 t2i 验收素材&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;待确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;产品提供素材后锁定&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;

    &lt;p class=&quot;hf-section-label&quot;&gt;开发启动条件&lt;/p&gt;
    &lt;div class=&quot;hf-case-rulebar&quot;&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;允许开始&lt;/strong&gt;&lt;span&gt;产品与技术确认 D0 清单后，才修改 shared 类型、固化 Provider、接入真实 gpt-5.6-sol、开发 Agent UI 或调用真实图片生成。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;禁止提前宣称&lt;/strong&gt;&lt;span&gt;现有未提交代码、mock / fake、规则 fallback 或静态方案不能作为真实多模态编译、浏览器体验或商业出图已验收的证据。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hf-case-rule&quot;&gt;&lt;strong&gt;混合工作树原则&lt;/strong&gt;&lt;span&gt;当前 Fable 未提交修改与本方案交叉；D0 确认前不 reset、stash、clean，不擅自提交或推送整棵工作树。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;hf-caption&quot;&gt;本附录用于产品和技术确认，不等于实现完成。确认后按 D0 → D1 → D2 → D3 → D4 → D5 分阶段开发，并分别报告代码、测试、真实模型和浏览器验收状态。&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;hf-view&quot; data-view-panel=&quot;wireframes&quot; hidden&gt;
    &lt;div class=&quot;hf-toolbar hf-wire-controls&quot; aria-label=&quot;页面线框选择&quot;&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;

  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)

    );

              `${Math.max(0, availableHeight)}px`,

      .then(({ x, y }) =&gt; {

  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
