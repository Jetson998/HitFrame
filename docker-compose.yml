# M1 本地基础设施：PostgreSQL；M2a S2 起：Valkey（BullMQ 队列）
# M2a S3 再追加：seaweedfs（或直连客户 OSS）
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hitframe
      POSTGRES_PASSWORD: hitframe
      POSTGRES_DB: hitframe
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '6379:6379'
    # noeviction：队列数据不可被内存策略丢弃（BullMQ 官方要求）
    command: ['valkey-server', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - valkeydata:/data
    restart: unless-stopped

  # 对象存储（Apache-2.0）：S3 兼容网关，供 STORAGE_DRIVER=s3 使用。
  # 生产可换客户 OSS（阿里云/腾讯云/AWS），仅改 .env 的 S3_* 即可，代码不变。
  seaweedfs:
    image: chrislusf/seaweedfs:3.68
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.port=8333
      - -master.volumeSizeLimitMB=1024
    ports:
      - '8333:8333' # S3 API
      - '8888:8888' # filer（调试可选）
    volumes:
      - seaweeddata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
  seaweeddata:
