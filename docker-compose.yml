# M1 本地基础设施：PostgreSQL；M2a S2 起：Valkey（BullMQ 队列）
# M2a S3 再追加：seaweedfs（或直连客户 OSS）
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hitframe
      POSTGRES_PASSWORD: hitframe
      POSTGRES_DB: hitframe
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '6379:6379'
    # noeviction：队列数据不可被内存策略丢弃（BullMQ 官方要求）
    command: ['valkey-server', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - valkeydata:/data
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
